<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- residential: plan view, walls with a door gap, threshold marked inset -->
  <symbol id="mark-residential" viewBox="0 0 32 32">
    <line x1="8" y1="8" x2="24" y2="8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="24" y1="8" x2="24" y2="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="8" y1="8" x2="8" y2="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="8" y1="24" x2="12" y2="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="20" y1="24" x2="24" y2="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="12" y1="22" x2="20" y2="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
  </symbol>

  <!-- commercial: shopfront elevation, wide rectangle with a counter line -->
  <symbol id="mark-commercial" viewBox="0 0 32 32">
    <line x1="6" y1="12" x2="26" y2="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="26" y1="12" x2="26" y2="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="26" y1="24" x2="6" y2="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="6" y1="24" x2="6" y2="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="6" y1="20" x2="26" y2="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
  </symbol>

  <!-- industrial: side profile, sawtooth roof sitting on a base line -->
  <symbol id="mark-industrial" viewBox="0 0 32 32">
    <line x1="6" y1="24" x2="26" y2="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
    <polyline points="6,24 13,12 16,22 23,12 26,24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
  </symbol>

  <!-- property-selection: irregular plot outline, compass rose at one corner -->
  <symbol id="mark-property-selection" viewBox="0 0 32 32">
    <polygon points="6,10 22,6 26,24 8,26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="24" y1="2" x2="24" y2="11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="21" y1="6" x2="27" y2="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
  </symbol>

  <!-- plot-construction: plot outline, foundation line, datum peg at one corner -->
  <symbol id="mark-plot-construction" viewBox="0 0 32 32">
    <polygon points="8,8 24,7 25,25 7,24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="10" y1="17" x2="22" y2="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="7" y1="27" x2="7" y2="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="5" y1="30" x2="9" y2="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
  </symbol>

  <!-- remote: floor plan, dashed sight line to an offset circle -->
  <symbol id="mark-remote" viewBox="0 0 32 32">
    <rect x="6" y="8" width="14" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="20" y1="18" x2="27" y2="25" stroke-dasharray="2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
    <circle cx="27" cy="25" r="3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"/>
  </symbol>

</svg>
